<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="img/">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/style.css">

    <title>Tabela de Jogos</title>
</head>
<body>
    <main class="container py-5">
        <div class="row align-items-center">

            <div class="col-sm-4">
                <img src="img/" alt="Tabela" class="img-fluid">
            </div>
            <div class="col-sm-8" id="divTabela">
        <form>
          <p>
            <label for="inClube">Clube: </label>
            <input type="text" id="inClube" class="form-control" autofocus>
          </p>

          <p>
            <input type="submit" value="Adicionar" class="btn btn-primary">
            <input type="button" value="Montar Tabela de Jogos" id="btMontar" class="btn btn-success">
            <input type="reset" value="Novos Clubes" class="btn btn-danger">
          </p>
        </form>
            </div>
        </div>
        
    </main>
    <script src="js/ex10_c.js"></script>
</body>
</html>
