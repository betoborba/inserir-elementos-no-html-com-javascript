<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="img/">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/style.css">

    <title>Vela de Aniversário</title>
</head>
<body>
    <main class="container py-5">
        <div class="row align-items-center">

            <div class="col-sm-5">
                <img src="img/" alt="Idade" class="img-fluid">
            </div>
            <div class="col-sm-7">
                <form>
                    <h1>Qual é a sua idade </h1>
                    <div class="mb-3">
                    <p><label for="inIdade"> A sua idade é:</label>

                    <input type="number" min="0" step="1" class="form-control" id="inIdade" required autofocus>
                    </p>
                    </div>

                    <div class="mb-4">
                    <p><input type="submit"  id="btExibir" class="btn btn-primary" value="Exibir Velas">
                    <input type="reset" class="btn btn-danger" value="Exibir Novas Velas">
                    </p>
                    </div>
                </form>

                <div id="divVelas"></div>
            </div>
        </div>
        
    </main>
    <script src="js/ex10_a.js"></script>
</body>
</html>
